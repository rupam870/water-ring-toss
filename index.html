        else if (antic.y > anticP.top + 10 || T - anticT > 3){                              // it missed
          if (antic.y > anticP.top + 10){ say(pick(L.miss), true); mood('upset', 1.4); A.kid('aww'); }
          antic = null;
        }
        // last ring: he goes quiet and nervous
        if (!nervousSaid && score() === N - 1 && T - lastSay > 2.5){ nervousSaid = true; say('Last one… shhh… focus 🤫', true); mood('lean', 3); }
        // you're pressing away but nothing's happening: he gets bored and teases
        if (roundOn && T - lastProgress > 25 && T - lastAction < 6 && T - tauntT > 18){
          tauntT = T;
          const corner = rings.some(r => r.peg < 0 && r.y > FLOOR - 25 && (r.x < 40 || r.x > LW - 40));
          if (corner && T - lastStuck > 40){ lastStuck = T; say(pick(L.stuck)); mood('wow', 1.4); }
          else { say(pick(L.taunt)); mood('laugh', 1.5); A.kid('laugh'); }
        }
        // you stopped playing
        if (!idleSaid && T - lastAction > 14 && T > 6){ idleSaid = true; say(pick(L.idle)); mood('sleepy', 4); }
        // and he's always waiting for his turn
        if (roundOn && turnStage < TURN.length && T - roundStart > TURN[turnStage][0] && T - lastSay > 4 && moodT <= 0){
          say(TURN[turnStage][1]); mood('impatient', 3.2); turnStage++;
        }
      }

      // eyes follow the action
      const tr = tank.getBoundingClientRect(), sr = svg.getBoundingClientRect();
      let tx = tr.left + tr.width / 2, ty = tr.top + tr.height * 0.55;
      if (focusT > 0 && focus){ focusT -= dt; tx = tr.left + focus.x * S; ty = tr.top + focus.top * S; }
      else {
        let best = null, bv = 45;
        for (const r of rings){ const v = Math.hypot(r.vx, r.vy); if (r.peg < 0 && v > bv){ bv = v; best = r; } }
        if (best){ tx = tr.left + best.x * S; ty = tr.top + best.y * S; }
      }
      const ex = sr.left + sr.width * 100 / 200, ey = sr.top + sr.height * 89 / 140;
      const dx = tx - ex, dy = ty - ey, d = Math.hypot(dx, dy) || 1;
      const k = Math.min(1, dt * 6);
      px += (dx / d * 3 - px) * k; py += (dy / d * 2.4 - py) * k;
      pupL.setAttribute('transform', `translate(${px.toFixed(2)} ${py.toFixed(2)})`);
      pupR.setAttribute('transform', `translate(${px.toFixed(2)} ${py.toFixed(2)})`);
      hd += (clamp(dx / d * 7, -8, 8) - hd) * k;
      look.style.transform = `rotate(${hd.toFixed(2)}deg)`;
    },
  };
})();

/* ---------- input ---------- */
const btns = [$('btnL'), $('btnR')];
function press(i){
  if (jets[i].held) return;
  jets[i].held = true;
  btns[i].classList.add('down');
  bump = Math.max(bump, 0.25 * (1 - jets[i].sq));   // you feel the thump through the plastic
  $('hint').classList.add('gone');
  if (!started && !won){ started = true; startTime = performance.now(); }
  kid.press();
  sfx.press(i);
}
function release(i){ jets[i].held = false; btns[i].classList.remove('down'); }

btns.forEach((b, i) => {
  b.addEventListener('pointerdown', e => { A.init(); e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch(_){} press(i); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, () => release(i)));
  b.addEventListener('contextmenu', e => e.preventDefault());
});
const LEFT = ['a', 's', 'f', 'z'], RIGHT = ['l', 'k', 'j', 'm'];
const TL = ['arrowleft', 'q'], TR = ['arrowright', 'e'];
const tiltKeys = { l: false, r: false };
let drag = null, sensorOn = false, sensorTilt = 0, gotSensor = false;
const restTilt = () => sensorOn ? sensorTilt : ((tiltKeys.r ? 1 : 0) - (tiltKeys.l ? 1 : 0)) * MAX_TILT;

addEventListener('keydown', e => {
  A.init();
  const k = e.key.toLowerCase();
  if (TL.includes(k) || TR.includes(k)){
    tiltKeys[TL.includes(k) ? 'l' : 'r'] = true;
    if (!drag) tiltTarget = restTilt();
    e.preventDefault(); return;
  }
  if (e.repeat) return;
  if (LEFT.includes(k)){ press(0); e.preventDefault(); }
  else if (RIGHT.includes(k)){ press(1); e.preventDefault(); }
  else if (k === 'r') resetGame();
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (LEFT.includes(k)) release(0);
  if (RIGHT.includes(k)) release(1);
  if (TL.includes(k) || TR.includes(k)){
    tiltKeys[TL.includes(k) ? 'l' : 'r'] = false;
    if (!drag) tiltTarget = restTilt();
  }
});
addEventListener('blur', () => { release(0); release(1); tiltKeys.l = tiltKeys.r = false; tiltTarget = restTilt(); });

// grab the toy anywhere (except the buttons) and drag sideways to tilt it
const stage = document.querySelector('.stage'), consoleEl = document.querySelector('.console'), rig = $('rig');
// rotate the toy (and the brother leaning on it) around the toy's own centre
function placePivot(){ const off = consoleEl.offsetTop + consoleEl.offsetHeight / 2; rig.style.transformOrigin = `50% ${off}px`; }
addEventListener('resize', placePivot); placePivot();
// iPhone blocks motion sensors inside embedded frames, so don't offer it there
try { if (window.top !== window.self && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') $('tiltBtn').style.display = 'none'; } catch(_){ }
stage.addEventListener('pointerdown', e => {
  A.init();
  if (e.target.closest('button')) return;
  const cr = consoleEl.getBoundingClientRect();
  const cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;
  drag = { id: e.pointerId, cx, cy, last: Math.atan2(e.clientY - cy, e.clientX - cx), px: e.clientX, acc: 0, start: tiltTarget };
  kid.action();
  try { stage.setPointerCapture(e.pointerId); } catch(_){}
  consoleEl.classList.add('grabbing');
  $('hint').classList.add('gone');
});
stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const a = Math.atan2(e.clientY - drag.cy, e.clientX - drag.cx);
  let d = a - drag.last; d = Math.atan2(Math.sin(d), Math.cos(d));
  if (Math.hypot(e.clientX - drag.cx, e.clientY - drag.cy) < 45) d = (e.clientX - drag.px) / 170; // too close to the centre: use sideways motion
  drag.last = a; drag.px = e.clientX; drag.acc += d;
  tiltTarget = clamp(drag.start + drag.acc, -MAX_TILT, MAX_TILT);
});
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag = null; consoleEl.classList.remove('grabbing');
  tiltTarget = restTilt();                       // let go and it rights itself
};
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

// phone motion sensor (works when the page is opened in a normal browser tab)
let toastT = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3800); }
// Work out which way real gravity points across the screen, however the phone is held
// (upright, reclined, or above your face in bed), and use that as the toy's tilt.
function onOri(e){
  if (!sensorOn || e.beta == null || e.gamma == null) return;
  gotSensor = true;
  const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
  const gx = Math.cos(b) * Math.sin(g), gy = Math.sin(b);       // gravity along screen-right and screen-down
  let a = Math.atan2(gx, gy);
  const ang = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * Math.PI / 180;
  a -= ang;
  a = Math.atan2(Math.sin(a), Math.cos(a));
  const m = Math.hypot(gx, gy);                                   // phone lying flat: gravity barely crosses the screen
  sensorTilt = clamp(a, -1.05, 1.05) * Math.min(1, m / 0.3);
  if (!drag) tiltTarget = sensorTilt;
}
// Shaking: the phone's own movement (gravity removed) throws the rings around, like jiggling the real toy
let lastMotion = 0;
function onMotion(e){
  const a = e.acceleration;
  if (!sensorOn || !a || a.x == null || a.y == null) return;
  lastMotion = performance.now();
  let ax = a.x, ay = -a.y;                                         // screen axes: x right, y down
  const ang = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * Math.PI / 180;
  if (ang){ const c = Math.cos(ang), s = Math.sin(ang); [ax, ay] = [ax * c + ay * s, -ax * s + ay * c]; }
  shake.x += (clamp(ax, -25, 25) - shake.x) * 0.4;
  shake.y += (clamp(ay, -25, 25) - shake.y) * 0.4;
}
async function enableSensor(silent){
  try {
    const reqs = [];   // ask for both in the same tap: iPhone shows one "motion & orientation" prompt
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') reqs.push(DeviceMotionEvent.requestPermission());
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') reqs.push(DeviceOrientationEvent.requestPermission());
    const res = await Promise.all(reqs);
    if (res.some(r => r !== 'granted')) throw new Error('denied');
  } catch(_){ if (!silent) toast("Motion access wasn't allowed. Drag the toy to tilt instead."); return; }
  gotSensor = false;
  addEventListener('deviceorientation', onOri);
  addEventListener('devicemotion', onMotion);
  setSensor(true);
  setTimeout(() => {
    if (sensorOn && !gotSensor){ setSensor(false); if (!silent) toast('No tilt sensor reached this page. Drag the toy or use ← → to tilt.'); }
  }, 1600);
}
function setSensor(on){
  sensorOn = on;
  $('tiltBtn').setAttribute('aria-pressed', on);
  $('tiltBtn').textContent = on ? 'Phone tilt: on' : 'Use phone tilt';
  if (on) $('tiltBtn').classList.remove('nudge');
  if (!on){ removeEventListener('deviceorientation', onOri); removeEventListener('devicemotion', onMotion); shake.x = shake.y = 0; tiltTarget = restTilt(); }
}
$('tiltBtn').addEventListener('click', async () => {
  A.init();
  if (sensorOn){ setSensor(false); return; }
  enableSensor(false);
});
// On a phone opened directly (not inside another app's frame): Android needs no permission, so tilt is on
// straight away; iPhone needs one tap, so the button is highlighted and the first pump press also asks.
const inFrame = (() => { try { return window.top !== window.self; } catch(_){ return true; } })();
const isTouch = matchMedia('(pointer:coarse)').matches;
const needsAsk = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';
if (isTouch && !inFrame){
  if (!needsAsk) enableSensor(true);
  else {
    $('tiltBtn').classList.add('nudge'); $('tiltBtn').textContent = 'Tap to tilt with your phone';
    let asked = false;
    const askOnce = () => { if (asked || sensorOn) return; asked = true; enableSensor(true); };
    btns.forEach(b => b.addEventListener('click', askOnce));
  }
}
$('soundBtn').addEventListener('click', () => {
  A.init();
  A.setMuted(!A.muted);
  $('soundBtn').textContent = A.muted ? 'Sound: off' : 'Sound: on';
  $('soundBtn').setAttribute('aria-pressed', !A.muted);
});
$('reset').addEventListener('click', resetGame);
$('again').addEventListener('click', resetGame);
addEventListener('resize', resize);

/* ---------- loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  const sub = 3;
  for (let i = 0; i < sub; i++) step(dt / sub);
  if (started && !won) elapsed = (now - startTime) / 1000;
  if (!won && score() === N){
    won = true; winTimer = 0.7;
    const sec = Math.floor(elapsed);
    $('winTime').textContent = `Time: ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
    sfx.win(); kid.win(); launchConfetti(); $('hint').classList.add('gone');
  }
  if (winTimer > 0){ winTimer -= dt; if (winTimer <= 0) $('win').classList.add('show'); }
  updateHUD();
  const vt = sensorOn ? 0 : tilt, fit = 1 / (1 + 0.45 * Math.abs(Math.sin(vt))); // shrink a little while tilted so it stays on screen
  rig.style.transform = `rotate(${vt}rad) translateY(${(-bump * 5).toFixed(2)}px) scale(${(fit * (1 + bump * 0.02)).toFixed(4)})`;
  A.setWater(jets[0].power, jets[1].power, Math.min(0.7, waterEnergy / 260));
  kid.update(dt);
  btns[0].style.setProperty('--sq', jets[0].sq.toFixed(3)); btns[1].style.setProperty('--sq', jets[1].sq.toFixed(3));
  drawSky(T, dt);
  draw();
  requestAnimationFrame(frame);
}

window.__rt = { get rings(){ return rings; }, PEGS, setTilt: v => { tiltTarget = v; }, tilt: () => tilt, energy: () => waterEnergy, set: o => { if ('VORT' in o) VORT = o.VORT; if ('VIN' in o) VIN = o.VIN; if ('VSUCK' in o) VSUCK = o.VSUCK; if ('JETH' in o) JETH = o.JETH; if ('VTHR' in o) VTHR = o.VTHR; if ('AIRLIFT' in o) AIRLIFT = o.AIRLIFT; if ('REACT' in o) REACT = o.REACT; if ('JETF' in o) JETF = o.JETF; if ('SRC' in o) SRC = o.SRC; }, fl: () => { let mn = 0, mx = 0, at = 0; for (let k = 0; k < fv.length; k++){ if (fv[k] < mn){ mn = fv[k]; at = k; } } return { minV: Math.round(mn), at: [at % NX, Math.floor(at / NX)], jet: jets.map(j => +j.power.toFixed(2)) }; }, step: (n, dt) => { const t0 = performance.now(); for (let i = 0; i < n; i++) step(dt); return (performance.now() - t0) / n; } };
resetGame();
resize();
requestAnimationFrame(frame);
})();
</script>
